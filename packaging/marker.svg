<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Marker">
  <!-- Hexagonal marker, side view, 60° tip-down-left. Symmetric tip on a yellow stroke capsule.
       Silhouette energy from Daniel's sketch; facets / symmetry / yellow stroke per brief. -->
  <defs>
    <linearGradient id="facetTop" x1="28" y1="46" x2="100" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe891"/>
      <stop offset="1" stop-color="#f7d45c"/>
    </linearGradient>
    <linearGradient id="facetMid" x1="28" y1="56" x2="100" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2c43c"/>
      <stop offset="1" stop-color="#e8b02a"/>
    </linearGradient>
    <linearGradient id="facetBot" x1="28" y1="74" x2="100" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d0901e"/>
      <stop offset="1" stop-color="#b87814"/>
    </linearGradient>
    <linearGradient id="tipTop" x1="8" y1="48" x2="36" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0c850"/>
      <stop offset="1" stop-color="#e0b038"/>
    </linearGradient>
    <linearGradient id="tipMid" x1="8" y1="60" x2="36" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c99422"/>
      <stop offset="1" stop-color="#b8881c"/>
    </linearGradient>
    <linearGradient id="tipBot" x1="8" y1="70" x2="36" y2="82" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a87016"/>
      <stop offset="1" stop-color="#8f5c10"/>
    </linearGradient>
    <linearGradient id="eraser" x1="102" y1="44" x2="120" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe6d2"/>
    </linearGradient>
    <linearGradient id="strokeFill" x1="16" y1="108" x2="78" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6d76e"/>
      <stop offset="1" stop-color="#ebb83c"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#1a1a1e"/>

  <!-- Pen tip-left / eraser-right; rotate -60° (60° from horizontal, tip down-left). -->
  <g transform="rotate(-60 64 64)">
    <!-- Hex barrel — three side facets (hex seen from the side) -->
    <path d="M34 46 H100 V56 H34 Z" fill="url(#facetTop)"/>
    <path d="M34 56 H100 V74 H34 Z" fill="url(#facetMid)"/>
    <path d="M34 74 H100 V84 H34 Z" fill="url(#facetBot)"/>
    <path d="M34 56 H100" stroke="#000" stroke-opacity="0.15" stroke-width="1.1"/>
    <path d="M34 74 H100" stroke="#000" stroke-opacity="0.20" stroke-width="1.1"/>
    <path d="M34 46 H100" stroke="#fff" stroke-opacity="0.30" stroke-width="1.5"/>

    <!-- Symmetric tip (point centered on axis) -->
    <path d="M34 46 L10 64 L34 56 Z" fill="url(#tipTop)"/>
    <path d="M34 56 L10 64 L34 74 Z" fill="url(#tipMid)"/>
    <path d="M34 74 L10 64 L34 84 Z" fill="url(#tipBot)"/>
    <path d="M34 56 L10 64" stroke="#000" stroke-opacity="0.16" stroke-width="0.9"/>
    <path d="M34 74 L10 64" stroke="#000" stroke-opacity="0.22" stroke-width="0.9"/>

    <!-- Ferrule -->
    <rect x="100" y="45" width="5" height="38" fill="#d6c296"/>
    <path d="M101.5 48 V80" stroke="#fff8e8" stroke-width="1.2" stroke-opacity="0.55"/>

    <!-- Cream eraser / end (proud of barrel) -->
    <rect x="105" y="43" width="17" height="42" rx="3.5" fill="url(#eraser)"/>
    <path d="M108 48 H119" stroke="#fff" stroke-opacity="0.42" stroke-width="1.7" stroke-linecap="round"/>
  </g>

  <!-- Yellowish marker stroke; tip rests on its top edge -->
  <rect x="18" y="108" width="56" height="12" rx="6" fill="url(#strokeFill)"/>
</svg>
