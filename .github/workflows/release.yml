name: Release

on:
  push:
    branches: [master]
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Build & publish Linux binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --release

      - name: Resolve release identity
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
            name="${GITHUB_REF_NAME}"
          else
            tag="build-${GITHUB_RUN_NUMBER}"
            name="Build ${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "asset=marker-${tag}-x86_64-unknown-linux-gnu" >> "$GITHUB_OUTPUT"

      - name: Package binary
        run: |
          set -euo pipefail
          strip -s target/release/marker
          install -D target/release/marker "dist/${{ steps.meta.outputs.asset }}"
          (cd dist && sha256sum "${{ steps.meta.outputs.asset }}" > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          draft: false
          generate_release_notes: true
          files: |
            dist/${{ steps.meta.outputs.asset }}
            dist/SHA256SUMS
          body: |
            Linux x86_64 release of Marker (egui + MuPDF).

            Commit: `${{ github.sha }}`

            Runtime shared libraries typically needed on the host:
            `fontconfig`, `freetype`, `brotli`, `jbig2dec`, `lcms2`, `libjpeg`, `openjpeg2`, `zlib`.

            License: MIT.
