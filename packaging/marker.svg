<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Marker">
  <!-- App icon: polished highlighter on a dark squircle. Source of truth for desktop + window icons. -->
  <defs>
    <linearGradient id="barrel" x1="18" y1="48" x2="96" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7d76e"/>
      <stop offset="0.5" stop-color="#f0bf3a"/>
      <stop offset="1" stop-color="#e3a82a"/>
    </linearGradient>
    <linearGradient id="tip" x1="96" y1="44" x2="118" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff9e4"/>
      <stop offset="1" stop-color="#f2dfa6"/>
    </linearGradient>
    <linearGradient id="ferrule" x1="88" y1="48" x2="100" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f6ecc8"/>
      <stop offset="1" stop-color="#d4bb7e"/>
    </linearGradient>
    <linearGradient id="endcap" x1="14" y1="52" x2="30" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0b040"/>
      <stop offset="1" stop-color="#b8821c"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#1a1a1e"/>

  <!-- Soft ink bloom under the tip -->
  <ellipse cx="78" cy="96" rx="34" ry="10" fill="#f0bf3a" opacity="0.18"/>

  <!-- Pen: tip NE → end SW -->
  <g transform="rotate(-35 64 64)">
    <!-- Barrel (wider, fills the mark) -->
    <path
      d="M26 50
         H90
         Q96 50 96 56
         V72
         Q96 78 90 78
         H26
         Q20 78 20 72
         V56
         Q20 50 26 50
         Z"
      fill="url(#barrel)"/>

    <!-- Specular -->
    <path
      d="M28 55 H88"
      stroke="#fff7d0"
      stroke-width="3.5"
      stroke-linecap="round"
      opacity="0.38"/>

    <!-- Grip rings -->
    <path d="M42 50 V78" stroke="#c9922a" stroke-width="2.25" opacity="0.30"/>
    <path d="M46 50 V78" stroke="#fff3b8" stroke-width="1.75" opacity="0.24"/>

    <!-- Ferrule -->
    <rect x="90" y="49" width="10" height="30" rx="1.5" fill="url(#ferrule)"/>
    <path d="M92.5 52 V76" stroke="#fff9e8" stroke-width="1.4" opacity="0.5"/>
    <path d="M97 52 V76" stroke="#b89a55" stroke-width="1.1" opacity="0.4"/>

    <!-- Chisel tip -->
    <path
      d="M100 53
         L116 44
         L122 50
         L116 67
         L100 75
         Z"
      fill="url(#tip)"/>
    <!-- Chisel face -->
    <path
      d="M116 44 L122 50 L116 67 Z"
      fill="#e6c56e"
      opacity="0.9"/>
    <path
      d="M106 58 L115 52"
      stroke="#c9a84a"
      stroke-width="1.75"
      stroke-linecap="round"
      opacity="0.5"/>

    <!-- End cap -->
    <path
      d="M20 53
         H28
         V75
         H20
         Q15 75 15 70
         V58
         Q15 53 20 53
         Z"
      fill="url(#endcap)"/>
    <!-- Eraser nub -->
    <path
      d="M15 58
         H20
         V70
         H15
         Q13 70 13 64
         Q13 58 15 58
         Z"
      fill="#f4d588"/>
  </g>
</svg>
