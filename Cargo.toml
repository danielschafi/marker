[package]
name = "marker"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal PDF annotator"
license = "MIT"

[dependencies]
# wayland-data-control is required on pure Wayland (Hyprland/Omarchy); the
# default X11 backend cannot see wl-clipboard image/png offers.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
directories = "6"
eframe = "0.33"
egui = "0.33"
# Match egui 0.33; default-features off so assistant MD never fetches/loads images.
egui_commonmark = { version = "0.22", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25.10", features = ["png"] }
libc = "0.2"
mitex = "0.2.4"
mupdf = { version = "0.8.0", default-features = false, features = [
    "base14-fonts",
    "brotli",
    "system-fonts",
    "sys-lib-brotli",
    "sys-lib-freetype",
    "sys-lib-harfbuzz",
    "sys-lib-jbig2dec",
    "sys-lib-lcms2",
    "sys-lib-libjpeg",
    "sys-lib-openjpeg",
    "sys-lib-zlib",
] }
resvg = "0.45"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
typst = "0.15"
typst-as-lib = { version = "0.16", default-features = false, features = [
    "typst-kit-embed-fonts",
    "typst-kit-fonts",
] }
typst-layout = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"

# winit 0.30 has no Wayland trackpad pinch; vendor a backport of PR #4338 so
# zwp_pointer_gestures_v1 reaches egui as Event::Zoom / PanGesture.
#
# egui-winit: when the clipboard has no text (image/png only), still emit Key::V
# so Ctrl+Shift+V can paste images instead of being swallowed as a no-op Paste.
[patch.crates-io]
winit = { path = "vendor/winit" }
egui-winit = { path = "vendor/egui-winit" }

[profile.dev.package."*"]
opt-level = 2
