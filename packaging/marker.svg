<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Marker">
  <!-- App icon: marked PDF page + highlighter tip. Source of truth for desktop + window icons. -->
  <defs>
    <linearGradient id="page" x1="24" y1="18" x2="104" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfaf6"/>
      <stop offset="1" stop-color="#ebe7dc"/>
    </linearGradient>
    <linearGradient id="ink" x1="30" y1="86" x2="102" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2cb55"/>
      <stop offset="0.55" stop-color="#f0bf3a"/>
      <stop offset="1" stop-color="#e8a82e"/>
    </linearGradient>
    <linearGradient id="tip" x1="92" y1="34" x2="108" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff6d2"/>
      <stop offset="1" stop-color="#f3e2a4"/>
    </linearGradient>
  </defs>

  <!-- Squircle chassis -->
  <rect width="128" height="128" rx="28" fill="#1a1a1e"/>

  <!-- Soft blue accent wedge (product accent) -->
  <path d="M28 28 H58 L28 58 Z" fill="#6e9ce6" opacity="0.92"/>

  <!-- Document -->
  <path
    d="M38 22
       H86
       C90 22 94 26 94 30
       V98
       C94 102 90 106 86 106
       H42
       C38 106 34 102 34 98
       V30
       C34 26 38 22 42 22
       Z"
    fill="url(#page)"/>

  <!-- Folded corner -->
  <path d="M86 22 L94 30 H88 C86.9 30 86 29.1 86 28 Z" fill="#d9d3c4"/>
  <path d="M86 22 V28 C86 29.1 86.9 30 88 30 Z" fill="#cfc8b6" opacity="0.9"/>

  <!-- Faint text lines -->
  <g stroke="#c9c2b4" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <path d="M46 42 H78"/>
    <path d="M46 52 H74"/>
    <path d="M46 62 H80"/>
    <path d="M46 72 H68"/>
  </g>

  <!-- Highlighter body / mark across the page -->
  <path
    d="M28 90
       L86 48
       C90 45 96 46 99 50
       L104 56
       C107 60 106 66 102 69
       L44 111
       C40 114 34 113 31 109
       L26 102
       C23 98 24 93 28 90
       Z"
    fill="url(#ink)"/>

  <!-- Marker tip (felt edge) -->
  <path
    d="M92 42
       L104 52
       L99 57
       L87 47
       Z"
    fill="url(#tip)"/>
  <path d="M94 45 L101 51" stroke="#c9922a" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

  <!-- Specular on the mark -->
  <path
    d="M40 92 L88 56"
    stroke="#fff4bf"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.35"/>
</svg>
