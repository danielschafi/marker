[package]
name = "marker"
version = "0.1.0"
edition = "2021"
description = "A fast, minimal PDF annotator"
license = "MIT"

[dependencies]
arboard = "3.6.1"
directories = "6"
eframe = "0.33"
egui = "0.33"
image = { version = "0.25.10", features = ["png"] }
mitex = "0.2.4"
mupdf = { version = "0.8.0", default-features = false, features = [
    "base14-fonts",
    "brotli",
    "system-fonts",
    "sys-lib-brotli",
    "sys-lib-freetype",
    "sys-lib-harfbuzz",
    "sys-lib-jbig2dec",
    "sys-lib-lcms2",
    "sys-lib-libjpeg",
    "sys-lib-openjpeg",
    "sys-lib-zlib",
] }
resvg = "0.45"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.9"
typst = "0.15"
typst-as-lib = { version = "0.16", default-features = false, features = [
    "typst-kit-embed-fonts",
    "typst-kit-fonts",
] }
typst-layout = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"

# winit 0.30 has no Wayland trackpad pinch; vendor a backport of PR #4338 so
# zwp_pointer_gestures_v1 reaches egui as Event::Zoom / PanGesture.
[patch.crates-io]
winit = { path = "vendor/winit" }

[profile.dev.package."*"]
opt-level = 2
